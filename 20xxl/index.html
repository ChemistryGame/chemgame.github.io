<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学元素消消乐 - 视觉增强版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
        }

        body {
            /* 修改为白色背景，加入轻微装饰 */
            background-color: #ffffff;
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            color: #333;
        }

        .game-container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            border: 2px solid #f0f0f0;
        }

        /* 顶部栏 */
        .header {
            background: #f8f9fa;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
        }

        .header-info h1 {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .header-info p {
            font-size: 14px;
            color: #7f8c8d;
        }

        .timer-panel {
            font-family: "Courier New", monospace;
            font-size: 36px;
            font-weight: bold;
            color: #e74c3c;
            background: #fff;
            padding: 5px 20px;
            border-radius: 10px;
            border: 2px solid #eee;
        }

        .game-main {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .player-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #f1f8ff;
            border-radius: 12px;
            border-left: 6px solid #3498db;
        }

        .p-name { font-size: 22px; font-weight: bold; color: #2c3e50; }
        .p-score { font-size: 22px; font-weight: bold; color: #f39c12; }

        .game-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .board-column {
            background: #fafafa;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #eee;
        }

        .board-title {
            text-align: center;
            margin-bottom: 20px;
            color: #95a5a6;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .grid-btn {
            aspect-ratio: 1/1;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            color: white;
            box-shadow: 0 5px 0 rgba(0,0,0,0.15);
            padding: 10px;
        }

        /* 字体增大核心设置 */
        .symbol-text {
            font-size: 32px; /* 增大符号字体 */
            font-weight: 800;
        }

        .name-text {
            font-size: 24px; /* 增大名称字体 */
            font-weight: bold;
        }

        .atomic-num {
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: 12px;
            font-weight: 900;
            background: rgba(255,255,255,0.3);
            padding: 2px 5px;
            border-radius: 4px;
        }

        .grid-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .grid-btn.selected {
            outline: 4px solid #2c3e50;
            outline-offset: 2px;
            transform: scale(1.05);
            z-index: 10;
        }

        .grid-btn:disabled {
            opacity: 0.1;
            cursor: default;
            transform: none;
            box-shadow: none;
        }

        /* 弹窗 */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            width: 90%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border: 1px solid #eee;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .mode-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #3498db;
            background: white;
            color: #3498db;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .mode-btn.active {
            background: #3498db;
            color: white;
        }

        input {
            width: 80%;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .start-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px 60px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }

        .error-log {
            text-align: left;
            background: #fff5f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #ffdada;
        }

        @media (max-width: 600px) {
            .game-board { grid-template-columns: 1fr; }
            .symbol-text { font-size: 28px; }
            .name-text { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="header-info">
                <h1>化学元素消消乐</h1>
                <p id="modeDisplay">模式：准备中</p>
            </div>
            <div class="timer-panel" id="timer">00:00</div>
        </div>

        <div class="game-main">
            <div class="player-info-bar">
                <span id="p1DisplayName" class="p-name">玩家</span>
                <span class="p-score">当前得分：<span id="p1Score">0</span></span>
            </div>

            <div class="game-board">
                <div class="board-column">
                    <div class="board-title">元素符号</div>
                    <div class="btn-grid" id="symbolGrid"></div>
                </div>
                <div class="board-column">
                    <div class="board-title">元素名称</div>
                    <div class="btn-grid" id="nameGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="startModal" class="modal">
        <div class="modal-content">
            <h2 style="font-size: 32px; color: #2c3e50; margin-bottom: 10px;">选择挑战模式</h2>
            <p style="color: #7f8c8d; margin-bottom: 25px;">请点击下方按钮选择难度</p>
            
            <input type="text" id="p1NameInput" placeholder="输入您的姓名" maxlength="10">
            
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('easy', this)">
                    <span style="font-size: 18px;">初级模式</span><br>
                    <small>有颜色和序号提示</small>
                </button>
                <button class="mode-btn" onclick="setMode('hard', this)">
                    <span style="font-size: 18px;">高级模式</span><br>
                    <small>无提示，全盲挑战</small>
                </button>
            </div>
            
            <button class="start-btn" onclick="startGame()">立即开始</button>
        </div>
    </div>

    <div id="resultModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 style="font-size: 36px; color: #2ecc71;">挑战成功！</h2>
            <div style="font-size: 24px; margin: 30px 0; color: #2c3e50;">
                <p>最终得分：<strong id="finalScore" style="color:#f39c12">0</strong></p>
                <p>挑战用时：<strong id="finalTime" style="color:#3498db">00:00</strong></p>
            </div>
            <div class="error-log" id="errorLog">
                <div id="errorList"></div>
            </div>
            <button class="start-btn" onclick="location.reload()" style="background: #3498db; margin-top: 20px;">重新挑战</button>
        </div>
    </div>

    <script>
        const elements = [
            {id: 1, s: 'H', n: '氢', color: '#4361EE'}, {id: 2, s: 'He', n: '氦', color: '#3A0CA3'},
            {id: 3, s: 'Li', n: '锂', color: '#7209B7'}, {id: 4, s: 'Be', n: '铍', color: '#B5179E'},
            {id: 5, s: 'B', n: '硼', color: '#F72585'}, {id: 6, s: 'C', n: '碳', color: '#4CC9F0'},
            {id: 7, s: 'N', n: '氮', color: '#4895EF'}, {id: 8, s: 'O', n: '氧', color: '#560BAD'},
            {id: 9, s: 'F', n: '氟', color: '#3F37C9'}, {id: 10, s: 'Ne', n: '氖', color: '#3A0CA3'},
            {id: 11, s: 'Na', n: '钠', color: '#480CA8'}, {id: 12, s: 'Mg', n: '镁', color: '#560BAD'},
            {id: 13, s: 'Al', n: '铝', color: '#7209B7'}, {id: 14, s: 'Si', n: '硅', color: '#B5179E'},
            {id: 15, s: 'P', n: '磷', color: '#F72585'}, {id: 16, s: 'S', n: '硫', color: '#E441E1'},
            {id: 17, s: 'Cl', n: '氯', color: '#2CCCE4'}, {id: 18, s: 'Ar', n: '氩', color: '#4895EF'},
            {id: 19, s: 'K', n: '钾', color: '#4361EE'}, {id: 20, s: 'Ca', n: '钙', color: '#3F37C9'}
        ];

        let state = {
            mode: 'easy',
            score: 0,
            matches: 0,
            startTime: null,
            timerId: null,
            selectedSymbol: null,
            selectedName: null,
            errors: [],
            isPlaying: false
        };

        function setMode(mode, btn) {
            state.mode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function shuffle(arr) {
            return arr.sort(() => Math.random() - 0.5);
        }

        function renderBoard() {
            const symbolGrid = document.getElementById('symbolGrid');
            const nameGrid = document.getElementById('nameGrid');
            symbolGrid.innerHTML = '';
            nameGrid.innerHTML = '';

            const shuffledSymbols = shuffle([...elements]);
            const shuffledNames = shuffle([...elements]);

            shuffledSymbols.forEach(el => {
                const btn = document.createElement('button');
                btn.className = 'grid-btn';
                
                if(state.mode === 'easy') {
                    btn.style.background = el.color;
                    btn.innerHTML = `<span class="atomic-num">${el.id}</span><span class="symbol-text">${el.s}</span>`;
                } else {
                    btn.style.background = '#2c3e50';
                    btn.innerHTML = `<span class="symbol-text">${el.s}</span>`;
                }
                
                btn.onclick = () => selectItem('symbol', el.s, btn);
                symbolGrid.appendChild(btn);
            });

            shuffledNames.forEach(el => {
                const btn = document.createElement('button');
                btn.className = 'grid-btn';
                
                if(state.mode === 'easy') {
                    btn.style.background = el.color;
                    btn.innerHTML = `<span class="atomic-num">${el.id}</span><span class="name-text">${el.n}</span>`;
                } else {
                    btn.style.background = '#27ae60';
                    btn.innerHTML = `<span class="name-text">${el.n}</span>`;
                }
                
                btn.onclick = () => selectItem('name', el.n, btn);
                nameGrid.appendChild(btn);
            });
        }

        function selectItem(type, value, btn) {
            if (!state.isPlaying) return;

            if (type === 'symbol') {
                if (state.selectedSymbol) state.selectedSymbol.btn.classList.remove('selected');
                state.selectedSymbol = { value, btn };
                btn.classList.add('selected');
            } else {
                if (state.selectedName) state.selectedName.btn.classList.remove('selected');
                state.selectedName = { value, btn };
                btn.classList.add('selected');
            }

            if (state.selectedSymbol && state.selectedName) {
                checkMatch();
            }
        }

        function checkMatch() {
            const s = state.selectedSymbol;
            const n = state.selectedName;
            const correctPair = elements.find(el => el.s === s.value);

            if (correctPair.n === n.value) {
                s.btn.disabled = true;
                n.btn.disabled = true;
                state.score += 10;
                state.matches++;
                if (state.matches === elements.length) endGame();
            } else {
                state.score = Math.max(0, state.score - 5);
                state.errors.push(`❌ 错误：符号 [${s.value}] 不对应名称 [${n.value}]`);
                s.btn.classList.remove('selected');
                n.btn.classList.remove('selected');
            }

            document.getElementById('p1Score').textContent = state.score;
            state.selectedSymbol = null;
            state.selectedName = null;
        }

        function startGame() {
            const name = document.getElementById('p1NameInput').value || "挑战者";
            document.getElementById('p1DisplayName').textContent = name;
            document.getElementById('modeDisplay').textContent = "当前挑战模式：" + (state.mode === 'easy' ? "初级" : "高级");
            document.getElementById('startModal').style.display = 'none';
            
            state.isPlaying = true;
            state.startTime = Date.now();
            state.timerId = setInterval(() => {
                const diff = Math.floor((Date.now() - state.startTime) / 1000);
                const m = Math.floor(diff/60).toString().padStart(2,'0');
                const s = (diff%60).toString().padStart(2,'0');
                document.getElementById('timer').textContent = `${m}:${s}`;
            }, 1000);
            
            renderBoard();
        }

        function endGame() {
            state.isPlaying = false;
            clearInterval(state.timerId);
            document.getElementById('finalScore').textContent = state.score;
            document.getElementById('finalTime').textContent = document.getElementById('timer').textContent;
            
            const list = document.getElementById('errorList');
            if(state.errors.length === 0) {
                list.innerHTML = '<p style="color:#27ae60; font-weight:bold; font-size:18px;">🌟 太棒了！满分通关，零失误！</p>';
            } else {
                list.innerHTML = '<p style="font-weight:bold; margin-bottom:10px;">错题总结：</p>';
                state.errors.slice(0, 8).forEach(err => {
                    const d = document.createElement('div');
                    d.style.marginBottom = '5px';
                    d.textContent = err;
                    list.appendChild(d);
                });
            }
            document.getElementById('resultModal').style.display = 'flex';
        }
    </script>
</body>
</html>
