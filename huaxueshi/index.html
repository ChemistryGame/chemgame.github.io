<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学式组合工厂-单人挑战版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }
        
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .title-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        h1 {
            color: #FFD700;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            line-height: 1.2;
        }

        .author-info {
            font-size: 14px;
            color: #bbdefb;
            letter-spacing: 1px;
            opacity: 0.9;
        }
        
        .timer {
            font-size: 2rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 25px;
            border-radius: 50px;
            border: 2px solid #FFD700;
        }
        
        .player {
            width: 100%;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
        }
        
        .player-name {
            font-size: 1.6rem;
            font-weight: bold;
            color: #FFD700;
        }
        
        .player-score {
            font-size: 2rem;
            color: #FFD700;
        }
        
        .current-question {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.8rem;
            font-weight: bold;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFD700;
            border: 1px solid rgba(255, 215, 0, 0.3);
            gap: 15px;
        }
        
        .btn-skip {
            background: linear-gradient(to bottom, #2c3e50, #34495e);
            color: #ffffff;
            border: 1px solid #bdc3c7;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .elements-panel {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .elements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 10px;
        }
        
        .element-btn {
            background: linear-gradient(to bottom, #3498db, #2980b9);
            color: white;
            font-weight: bold;
            padding: 12px 5px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            border: 1px solid #1ABC9C;
            font-size: 18px;
        }
        
        .element-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 8px rgba(0,0,0,0.3);
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .formula-display {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
            min-height: 80px;
            font-size: 2.2rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .btn-submit, .btn-clear, .btn-backspace {
            flex: 1;
            max-width: 180px;
            padding: 15px 10px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        .btn-submit { background: linear-gradient(to bottom, #27ae60, #219653); }
        .btn-clear { background: linear-gradient(to bottom, #e74c3c, #c0392b); }
        .btn-backspace { background: linear-gradient(to bottom, #f39c12, #e67e22); }
        
        .history {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .history-item {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }
        
        .player-feedback {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 2.5rem;
            font-weight: bold;
            z-index: 100;
            display: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        .feedback-correct { background: linear-gradient(to right, #2ecc71, #27ae60); color: white; }
        .feedback-incorrect { background: linear-gradient(to right, #e74c3c, #c0392b); color: white; }

        /* 模态框通用样式 */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #e3f2fd;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-title { color: #e74c3c; font-size: 1.8rem; font-weight: bold; margin-bottom: 15px; flex-shrink: 0; }
        
        /* 结算弹窗内的历史记录列表 */
        .final-history-container {
            background: white;
            border-radius: 12px;
            margin: 15px 0;
            padding: 10px;
            border: 1px solid #ddd;
            overflow-y: auto;
            flex-grow: 1; /* 自动撑开 */
            text-align: left;
        }

        .final-history-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 1rem;
        }

        .final-history-item:last-child { border-bottom: none; }

        .play-btn { 
            background: linear-gradient(to right, #FF512F, #DD2476); 
            color: white; border: none; padding: 15px 40px; 
            border-radius: 30px; font-size: 1.2rem; cursor: pointer;
            font-weight: bold; flex-shrink: 0;
            margin-top: 10px;
        }

        .bg-music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 400;
            font-size: 24px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .header-container { flex-direction: column; gap: 10px; text-align: center; }
            .elements-grid { grid-template-columns: repeat(5, 1fr); }
            .btn-submit, .btn-clear, .btn-backspace { padding: 12px 5px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-container">
            <div class="title-group">
                <h1>🧪化学式组合工厂-单人挑战版</h1>
                <div class="author-info">浙江师范大学 教育学院 黄梦兰改编制作</div>
            </div>
            <div class="timer" id="timer">03:00</div>
        </div>
        
        <div class="player">
            <div class="player-feedback feedback-correct" id="feedback-correct">正确! 🎉</div>
            <div class="player-feedback feedback-incorrect" id="feedback-incorrect">错误! 😞</div>
            
            <div class="player-header">
                <div class="player-name">👨‍🔬 <span id="display-name">玩家</span></div>
                <div class="player-score" id="score">得分：0</div>
            </div>
            
            <div class="current-question" id="question">
                准备开始...
                <button class="btn-skip" id="btn-skip">跳过 ⏭️</button>
            </div>
            
            <div class="elements-panel">
                <div class="elements-grid" id="elements-grid"></div>
            </div>
            
            <div class="input-area">
                <div class="formula-display" id="formula-display"></div>
                <div class="control-buttons">
                    <button class="btn-submit" id="btn-submit">提交 ✅</button>
                    <button class="btn-clear" id="btn-clear">清空 🗑️</button>
                    <button class="btn-backspace" id="btn-backspace">删除 🔙</button>
                </div>
            </div>
            
            <div class="history" id="history">
                <div class="history-item">答题记录将显示在这里 📝</div>
            </div>
        </div>
    </div>

    <div class="modal" id="startModal">
        <div class="modal-content">
            <div class="modal-title">化学式拼写挑战</div>
            <p style="margin-bottom: 20px; line-height: 1.6;">在 3 分钟内尽可能多地拼写出正确的化学式。<br>挑战包含单质、氧化物、酸碱盐等 70 余种物质！</p>
            <input type="text" id="nameInput" placeholder="请输入你的姓名" 
                   style="width:100%; padding:15px; font-size:1.1rem; border-radius:8px; border:2px solid #FFD700; margin-bottom:15px; outline: none;">
            <button class="play-btn" id="startBtn">开启挑战之旅</button>
        </div>
    </div>

    <div class="modal" id="victoryModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-title">挑战结束！🏆</div>
            
            <div style="display: flex; justify-content: space-around; background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; font-weight: bold;">
                <div>得分: <span id="final-score" style="color:#e74c3c">0</span></div>
                <div>正确: <span id="final-correct" style="color:#27ae60">0</span></div>
                <div>错误/跳过: <span id="final-mistakes" style="color:#f39c12">0</span></div>
            </div>

            <p style="text-align: left; font-weight: bold; margin-left: 5px;">📜 挑战复盘：</p>
            
            <div class="final-history-container" id="final-history-list">
                </div>

            <button class="play-btn" onclick="location.reload()">重新开始挑战</button>
        </div>
    </div>

    <div class="bg-music-control" id="bgMusicControl">🎵</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 物质数据
            const chemicalSubstances = [
                { name: "铁", formula: "Fe" }, { name: "铜", formula: "Cu" }, { name: "铝", formula: "Al" },
                { name: "金", formula: "Au" }, { name: "银", formula: "Ag" }, { name: "汞", formula: "Hg" },
                { name: "硅", formula: "Si" }, { name: "石墨", formula: "C" }, { name: "金刚石", formula: "C" },
                { name: "硫", formula: "S" }, { name: "磷", formula: "P" }, { name: "液溴", formula: "Br₂" },
                { name: "氢气", formula: "H₂" }, { name: "氧气", formula: "O₂" }, { name: "臭氧", formula: "O₃" },
                { name: "氮气", formula: "N₂" }, { name: "氯气", formula: "Cl₂" }, { name: "氦气", formula: "He" },
                { name: "氖气", formula: "Ne" }, { name: "氩气", formula: "Ar" }, { name: "甲烷", formula: "CH₄" },
                { name: "乙醇", formula: "C₂H₅OH" }, { name: "一氧化碳", formula: "CO" }, { name: "二氧化碳", formula: "CO₂" },
                { name: "一氧化氮", formula: "NO" }, { name: "二氧化氮", formula: "NO₂" }, { name: "三氧化硫", formula: "SO₃" },
                { name: "五氧化二磷", formula: "P₂O₅" }, { name: "氧化镁", formula: "MgO" }, { name: "氧化钙", formula: "CaO" },
                { name: "氧化铜", formula: "CuO" }, { name: "氧化亚铜", formula: "Cu₂O" }, { name: "氧化铁", formula: "Fe₂O₃" },
                { name: "四氧化三铁", formula: "Fe₃O₄" }, { name: "氧化亚铁", formula: "FeO" }, { name: "氧化铝", formula: "Al₂O₃" },
                { name: "二氧化锰", formula: "MnO₂" }, { name: "氯化钠", formula: "NaCl" }, { name: "氯化钾", formula: "KCl" },
                { name: "氯化镁", formula: "MgCl₂" }, { name: "氯化钡", formula: "BaCl₂" }, { name: "氯化钙", formula: "CaCl₂" },
                { name: "氯化铝", formula: "AlCl₃" }, { name: "氯化氢", formula: "HCl" }, { name: "氯化铜", formula: "CuCl₂" },
                { name: "氯化铁", formula: "FeCl₃" }, { name: "氯化亚铁", formula: "FeCl₂" }, { name: "水", formula: "H₂O" },
                { name: "硫酸", formula: "H₂SO₄" }, { name: "氢氧化钠", formula: "NaOH" }, { name: "氨气", formula: "NH₃" },
                { name: "葡萄糖", formula: "C₆H₁₂O₆" }, { name: "碳酸钙", formula: "CaCO₃" }, { name: "硝酸", formula: "HNO₃" },
                { name: "醋酸", formula: "CH₃COOH" }, { name: "硫酸铜", formula: "CuSO₄" }, { name: "氢氧化钙", formula: "Ca(OH)₂" },
                { name: "氯化银", formula: "AgCl" }, { name: "硫化氢", formula: "H₂S" }, { name: "磷酸", formula: "H₃PO₄" },
                { name: "碳酸", formula: "H₂CO₃" }, { name: "氢氧化铝", formula: "Al(OH)₃" }, { name: "硝酸银", formula: "AgNO₃" },
                { name: "硫酸钡", formula: "BaSO₄" }, { name: "碳酸钠", formula: "Na₂CO₃" }, { name: "碳酸氢钠", formula: "NaHCO₃" },
                { name: "高锰酸钾", formula: "KMnO₄" }, { name: "氯酸钾", formula: "KClO₃" }, { name: "过氧化氢", formula: "H₂O₂" },
                { name: "二氧化硫", formula: "SO₂" }
            ];
            
            const elements = ["H", "He", "C", "N", "O", "Ne", "Na", "Mg", "Al", "Si", "P", "S", "Cl", "Ar", "K", "Ca", "Mn", "Fe", "Cu", "Zn", "Br", "Ag", "Sn", "I", "Ba", "Au", "Hg", "(", ")", "₁", "₂", "₃", "₄", "₅", "₆", "₇", "₈"];
            
            let state = {
                timeLeft: 180,
                isPlaying: false,
                score: 0,
                correctCount: 0,
                mistakeCount: 0,
                currentQuestion: "",
                currentFormula: "",
                history: [],
                usedIndices: new Set()
            };

            const bgAudio = new Audio('sounds/bg.mp3'); bgAudio.loop = true;
            function playSfx(type) { new Audio(`sounds/${type}.mp3`).play().catch(()=>{}); }

            const grid = document.getElementById('elements-grid');
            elements.forEach(el => {
                const btn = document.createElement('div');
                btn.className = 'element-btn';
                btn.textContent = el;
                btn.onclick = () => {
                    if(!state.isPlaying) return;
                    playSfx('click');
                    state.currentFormula += el;
                    updateDisplay();
                };
                grid.appendChild(btn);
            });

            function updateDisplay() {
                const display = document.getElementById('formula-display');
                display.innerHTML = state.currentFormula.split('').map(c => `<span>${c}</span>`).join('');
            }

            function generateQuestion() {
                if(state.usedIndices.size >= chemicalSubstances.length) state.usedIndices.clear();
                let idx;
                do { idx = Math.floor(Math.random() * chemicalSubstances.length); } while(state.usedIndices.has(idx));
                state.usedIndices.add(idx);
                state.currentQuestion = chemicalSubstances[idx].name;
                document.getElementById('question').firstChild.textContent = state.currentQuestion;
            }

            document.getElementById('btn-submit').onclick = () => {
                if(!state.isPlaying || !state.currentFormula) return;
                const substance = chemicalSubstances.find(s => s.name === state.currentQuestion);
                if(state.currentFormula === substance.formula) {
                    state.score += 10; state.correctCount++;
                    showFeedback('correct'); playSfx('right');
                    state.history.push({q: state.currentQuestion, f: state.currentFormula, res: '✅'});
                    generateQuestion();
                } else {
                    state.mistakeCount++;
                    showFeedback('incorrect'); playSfx('error');
                    state.history.push({q: state.currentQuestion, f: state.currentFormula, res: '❌'});
                }
                state.currentFormula = ""; updateDisplay(); updateUI();
            };

            document.getElementById('btn-skip').onclick = () => {
                if(!state.isPlaying) return;
                state.history.push({q: state.currentQuestion, f: '[跳过]', res: '⏭️'});
                generateQuestion(); state.currentFormula = ""; updateDisplay(); updateUI();
            };

            document.getElementById('btn-clear').onclick = () => { if(!state.isPlaying) return; state.currentFormula = ""; updateDisplay(); };
            document.getElementById('btn-backspace').onclick = () => { if(!state.isPlaying) return; state.currentFormula = state.currentFormula.slice(0,-1); updateDisplay(); };

            function showFeedback(type) {
                const el = document.getElementById(`feedback-${type}`);
                el.style.display = 'block';
                setTimeout(() => el.style.display = 'none', 800);
            }

            function updateUI() {
                document.getElementById('score').textContent = `得分：${state.score}`;
                const histEl = document.getElementById('history');
                histEl.innerHTML = state.history.slice(-4).reverse().map(item => 
                    `<div class="history-item"><span>${item.q} -> ${item.f}</span> <span>${item.res}</span></div>`
                ).join('');
            }

            function showFinalResults() {
                state.isPlaying = false;
                bgAudio.pause();
                playSfx('endhappy');
                
                // 填充统计数据
                document.getElementById('final-score').textContent = state.score;
                document.getElementById('final-correct').textContent = state.correctCount;
                document.getElementById('final-mistakes').textContent = state.mistakeCount + (state.history.filter(h => h.res === '⏭️').length);
                
                // 填充详细记录列表
                const finalHistList = document.getElementById('final-history-list');
                finalHistList.innerHTML = state.history.map(item => `
                    <div class="final-history-item">
                        <span>${item.q}</span>
                        <span style="color: ${item.res === '✅' ? '#27ae60' : '#e74c3c'}">${item.f}</span>
                        <span>${item.res}</span>
                    </div>
                `).join('');
                
                if(state.history.length === 0) finalHistList.innerHTML = '<p style="text-align:center; padding:20px; color:#999;">暂无答题记录</p>';
                
                document.getElementById('victoryModal').style.display = 'flex';
            }

            document.getElementById('startBtn').onclick = () => {
                const name = document.getElementById('nameInput').value.trim() || "挑战者";
                document.getElementById('display-name').textContent = name;
                document.getElementById('startModal').style.display = 'none';
                state.isPlaying = true;
                bgAudio.play().catch(()=>{});
                generateQuestion();
                
                const timer = setInterval(() => {
                    state.timeLeft--;
                    const m = Math.floor(state.timeLeft/60), s = state.timeLeft%60;
                    document.getElementById('timer').textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                    if(state.timeLeft <= 0) {
                        clearInterval(timer);
                        showFinalResults();
                    }
                }, 1000);
            };

            let musicOn = true;
            document.getElementById('bgMusicControl').onclick = function() {
                musicOn = !musicOn;
                this.textContent = musicOn ? '🎵' : '🔇';
                musicOn ? bgAudio.play() : bgAudio.pause();
            };
        });
    </script>
</body>
</html>
