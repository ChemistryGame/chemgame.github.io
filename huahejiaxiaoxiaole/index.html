<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化合价消消乐 - 单人挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #e0f7fa;
            background-image: radial-gradient(#b3e5fc 1px, transparent 2px);
            background-size: 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        
        .game-container {
            width: 100%;
            max-width: 900px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }
        
        .header {
            background: linear-gradient(to right, #4db6ac, #81c784);
            padding: 10px 20px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            border-bottom: 2px solid #26a69a;
            gap: 20px
        }
        
        .title {
            color: white;
            font-size: 30px;
            font-weight: bold;
            text-align: left;
            flex: 1;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
        }
        
        .time-display {
            font-size: 26px;
            font-weight: bold;
            color: #004d40;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px 16px;
            border-radius: 25px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .time-display::before {
            content: '⏱️';
            margin-right: 8px;
            font-size: 35px;
        }
        
        .players-container {
            display: flex;
            width: 100%;
            min-height: 450px;
            justify-content: center;
        }
        
        .player-section {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: rgba(129, 199, 132, 0.05);
        }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 20px;
            border-radius: 12px;
            background: linear-gradient(to right, rgba(77, 182, 172, 0.3), rgba(129, 199, 132, 0.3));
        }
        
        .player-name {
            font-size: 24px;
            font-weight: bold;
            color: #00695c;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .player-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 40px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .player-score {
            font-size: 24px;
            color: #d32f2f;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .section-title {
            font-size: 22px;
            margin-bottom: 12px;
            color: #00695c;
            text-align: center;
            font-weight: bold;
            padding: 8px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
        }
        
        .valence-section, .elements-section {
            background-color: #e3f2fd;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }
        
        .valence-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding-bottom: 4px;
        }
        
        .valence-btn {
            background: linear-gradient(to bottom, #ff9800, #f57c00);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 14px 24px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }
        
        .valence-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 8px rgba(0, 0, 0, 0.25);
        }
        
        .valence-btn.selected {
            background: linear-gradient(to bottom, #e65100, #bf360c);
            box-shadow: 0 0 12px rgba(230, 81, 0, 0.7);
        }
        
        .valence-btn.completed {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .element-buttons {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 15px;
        }
        
        .element-btn {
            background: linear-gradient(to bottom, #42a5f5, #1976d2);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 12px 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .element-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 8px rgba(0, 0, 0, 0.2);
        }
        
        .element-btn.selected {
            background: linear-gradient(to bottom, #1976d2, #1565c0);
            box-shadow: 0 0 12px rgba(25, 118, 210, 0.7);
        }
        
        .element-btn.correct {
            background: linear-gradient(to bottom, #f44336, #d32f2f);
            box-shadow: 0 0 12px rgba(244, 67, 54, 0.7);
            cursor: default;
        }
        
        .element-btn.completed {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .element-btn .symbol {
            font-size: 16px;
            margin-top: 6px;
        }
        
        .element-btn .valence-tag {
            position: absolute;
            top: -8px;
            right: -8px;
            background: linear-gradient(45deg, #ffeb3b, #ffc107);
            color: #f44336;
            font-weight: bold;
            font-size: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            border: 2px solid #ff9800;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        
        .shake {
            animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        .feedback-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
            width: 90%;
        }
        
        .feedback {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: fadeUp 1.5s forwards;
            margin-bottom: 5px;
        }
        
        .feedback-text {
            font-size: 20px;
            font-weight: bold;
        }
        
        .feedback.correct .feedback-text { color: #4caf50; }
        .feedback.error .feedback-text { color: #f44336; }
        
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        
        .game-over-modal, .start-modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.65);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-content {
            background: linear-gradient(to bottom, #e3f2fd, #bbdefb);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-title {
            color: #d32f2f;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .final-stats {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            text-align: left;
        }
        
        .final-stats h3 {
            margin-bottom: 15px;
            color: #00695c;
            font-size: 24px;
            text-align: center;
            border-bottom: 2px dashed #b2dfdb;
            padding-bottom: 10px;
        }

        .stats-info {
            display: flex;
            justify-content: space-around;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .error-list {
            font-size: 16px;
            color: #d32f2f;
            max-height: 200px;
            overflow-y: auto;
            background: #fafafa;
            padding: 10px;
            border-radius: 8px;
        }
        
        .error-item {
            margin: 8px 0;
            padding: 8px 12px;
            background: #ffebee;
            border-radius: 6px;
        }
        
        .play-again-btn {
            background: linear-gradient(to bottom, #f44336, #d32f2f);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .play-again-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.25);
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0.8;
            border-radius: 0;
            animation: confetti-fall 5s linear forwards;
        }
        
        @keyframes confetti-fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(600px) rotate(720deg); opacity: 0; }
        }
        
        /* 背景音乐控制按钮 */
        .bg-music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            z-index: 400;
            font-size: 28px;
            transition: all 0.2s;
        }
        
        .bg-music-control:hover {
            transform: scale(1.1);
        }
        
        .bg-music-control.paused {
            background: rgba(200, 200, 200, 0.85);
        }
        
        @media (max-width: 900px) {
            .element-buttons { grid-template-columns: repeat(6, 1fr); }
        }
        @media (max-width: 600px) {
            .element-buttons { grid-template-columns: repeat(4, 1fr); }
            .header { flex-direction: column; gap: 10px; padding: 12px; }
            .title { font-size: 22px; text-align: center; }
            .valence-buttons { gap: 8px; }
            .valence-btn { padding: 10px 16px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🧪化合价消消乐 - 单人挑战⚗️
              <div style="font-size: 14px; color: #bbdefb; margin-top: 5px; font-weight: normal;">
                浙江师范大学 教育学院 黄梦兰改编制作
              </div>
            </div>
            <div class="time-display">时间: <span id="time">00:00</span></div>
        </div>
        
        <div class="players-container">
            <div class="player-section">
                
                <div class="player-header">
                    <div class="player-name">
                        <div class="player-avatar">🧑</div>
                        <span id="display-name">玩家</span>
                    </div>
                    <div class="player-score">得分: <span id="score">0</span></div>
                </div>
                
                <div class="valence-section">
                    <div class="section-title">化合价</div>
                    <div class="valence-buttons" id="valenceButtons"></div>
                </div>
                
                <div class="elements-section">
                    <div class="section-title">元素与原子团</div>
                    <div class="element-buttons" id="elementButtons"></div>
                </div>
                
                <div class="feedback-container" id="feedback"></div>
            </div>
        </div>
        
        <div class="start-modal" id="startModal" style="display: flex;">
            <div class="modal-content">
                <div class="modal-title">欢迎进入化合价消消乐</div>
                
                <div style="margin: 20px 0; text-align: left; background: rgba(255,255,255,0.08); padding: 16px; border-radius: 10px;">
                    <ul style="padding-left: 24px; list-style: disc; line-height: 1.8; font-size: 17px;">
                        <li>上方为 <strong>化合价</strong>，下方为 <strong>元素/原子团</strong></li>
                        <li>先后点击一个元素/原子团按钮 + 一个化合价按钮（顺序不限）进行匹配</li>
                        <li>匹配成功 +5分，匹配错误 -5分</li>
                        <li>以最快的速度完成全部24对匹配挑战吧！</li>
                    </ul>
                </div>
                
                <div style="margin:30px 0; text-align:left;">
                    <div style="margin-bottom:20px;">
                        <label style="display:block; margin-bottom:8px; color:#42a5f5; font-weight:bold; font-size: 18px;">玩家姓名：</label>
                        <input type="text" id="nameInput" placeholder="请输入您的姓名" 
                               style="width:100%; padding:12px; font-size:18px; border-radius:8px; border:2px solid #42a5f5; outline:none; background:rgba(255,255,255,0.8); color:#333;">
                    </div>
                </div>
                
                <button class="play-again-btn" id="startBtn">确认并开始挑战</button>
            </div>
        </div>
        
        <div class="game-over-modal" id="gameOverModal">
            <div class="modal-content">
                <div class="modal-title">🎉 挑战完成！ 🎉</div>
                
                <div class="final-stats">
                    <h3 id="finalName">玩家</h3>
                    <div class="stats-info">
                        <p>得分: <span id="finalScore" style="color: #d32f2f;">0</span></p>
                        <p>用时: <span id="finalTime" style="color: #d32f2f;">00:00</span></p>
                    </div>
                    <div class="error-list" id="errorList">
                        <strong>错误记录：</strong><br>
                    </div>
                </div>
                
                <button class="play-again-btn" id="playAgainBtn">再玩一次</button>
            </div>
        </div>
        
        <div class="bg-music-control" id="bgMusicControl"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏状态变量（合并为单人）
            let elapsedTime = 0;
            let currentScore = 0;
            let matchedPairsCount = 0;
            let timerInterval = null;
            let gameActive = false;
            let gameStartTime = 0;
            let bgMusicPlaying = true;
            let playerName = "玩家";
            
            let selectedElementBtn = null;
            let selectedValenceVal = null;
            let errorRecordsArray = [];
            
            const allElements = [
                {symbol: 'H', name: '氢', valence: '+1', displaySymbol: 'H'},
                {symbol: 'Ag', name: '银', valence: '+1', displaySymbol: 'Ag'},
                {symbol: 'Na', name: '钠', valence: '+1', displaySymbol: 'Na'},
                {symbol: 'K', name: '钾', valence: '+1', displaySymbol: 'K'},
                {symbol: 'Cu1', name: '亚铜', valence: '+1', displaySymbol: 'Cu'},
                {symbol: 'NH4', name: '铵根', valence: '+1', displaySymbol: 'NH₄'},
                {symbol: 'Ca', name: '钙', valence: '+2', displaySymbol: 'Ca'},
                {symbol: 'Mg', name: '镁', valence: '+2', displaySymbol: 'Mg'},
                {symbol: 'Ba', name: '钡', valence: '+2', displaySymbol: 'Ba'},
                {symbol: 'Zn', name: '锌', valence: '+2', displaySymbol: 'Zn'},
                {symbol: 'Cu2', name: '铜', valence: '+2', displaySymbol: 'Cu'},
                {symbol: 'Fe2', name: '亚铁', valence: '+2', displaySymbol: 'Fe'},
                {symbol: 'Fe3', name: '铁', valence: '+3', displaySymbol: 'Fe'},
                {symbol: 'Al', name: '铝', valence: '+3', displaySymbol: 'Al'},
                {symbol: 'Si', name: '硅', valence: '+4', displaySymbol: 'Si'},
                {symbol: 'P', name: '磷', valence: '+5', displaySymbol: 'P'},
                {symbol: 'F', name: '氟', valence: '-1', displaySymbol: 'F'},
                {symbol: 'Cl', name: '氯', valence: '-1', displaySymbol: 'Cl'},
                {symbol: 'Br', name: '溴', valence: '-1', displaySymbol: 'Br'},
                {symbol: 'I', name: '碘', valence: '-1', displaySymbol: 'I'},
                {symbol: 'OH', name: '氢氧根', valence: '-1', displaySymbol: 'OH'},
                {symbol: 'NO3', name: '硝酸根', valence: '-1', displaySymbol: 'NO₃'},
                {symbol: 'O', name: '氧', valence: '-2', displaySymbol: 'O'},
                {symbol: 'SO4', name: '硫酸根', valence: '-2', displaySymbol: 'SO₄'},
                {symbol: 'CO3', name: '碳酸根', valence: '-2', displaySymbol: 'CO₃'}
            ];
            
            const valences = ['+1', '+2', '+3', '+4', '+5', '-1', '-2'];
            let currentElements = [];
            
            // DOM 元素获取
            const timeDisplay = document.getElementById('time');
            const scoreDisplay = document.getElementById('score');
            const valenceButtonsContainer = document.getElementById('valenceButtons');
            const elementButtonsContainer = document.getElementById('elementButtons');
            const gameOverModal = document.getElementById('gameOverModal');
            const startModal = document.getElementById('startModal');
            
            const finalScoreDisplay = document.getElementById('finalScore');
            const finalTimeDisplay = document.getElementById('finalTime');
            const playAgainBtn = document.getElementById('playAgainBtn');
            const startBtn = document.getElementById('startBtn');
            const feedbackContainer = document.getElementById('feedback');
            const bgMusicControl = document.getElementById('bgMusicControl');
            const errorListDOM = document.getElementById('errorList');
            const displayName = document.getElementById('display-name');
            const finalNameDisplay = document.getElementById('finalName');
            
            const soundPaths = {
                bg: 'sounds/bg.mp3',
                click: 'sounds/click.mp3',
                right: 'sounds/right.mp3',
                error: 'sounds/error.mp3',
                endhappy: 'sounds/endhappy.mp3',
                yanhua: 'sounds/yanhua.mp3'
            };
            
            const bgAudio = new Audio(soundPaths.bg);
            bgAudio.loop = true;
            bgAudio.volume = 0.5;
            
            function playSound(type) {
                if (type === 'bg') {
                    if (bgMusicPlaying) bgAudio.play().catch(() => {});
                    return;
                }
                const audio = new Audio(soundPaths[type]);
                audio.volume = 0.7;
                audio.play().catch(() => {});
            }
            
            function toggleBgMusic() {
                bgMusicPlaying = !bgMusicPlaying;
                if (bgMusicPlaying) {
                    bgAudio.play();
                    bgMusicControl.textContent = '🎵';
                    bgMusicControl.classList.remove('paused');
                } else {
                    bgAudio.pause();
                    bgMusicControl.textContent = '🔇';
                    bgMusicControl.classList.add('paused');
                }
            }

            // ⚠️ 补充被遗漏的打乱数组函数 ⚠️
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
            
            function initGame() {
                elapsedTime = 0;
                currentScore = 0;
                matchedPairsCount = 0;
                selectedElementBtn = null;
                selectedValenceVal = null;
                errorRecordsArray = [];
                gameActive = false;
                
                updateTimeDisplay();
                updateScoreDisplay();
                gameOverModal.style.display = 'none';
                
                renderValenceButtons();
                
                // 这里调用了 shuffleArray，之前缺了这个函数导致代码中断
                currentElements = shuffleArray(allElements.slice()).slice(0, 24);
                renderElementButtons();
                
                if (timerInterval) clearInterval(timerInterval);
                startModal.style.display = 'flex';
                
                bgMusicPlaying = true;
                bgMusicControl.textContent = '🎵';
                bgMusicControl.classList.remove('paused');
                playSound('bg');
            }
            
            function startGame() {
                const inputName = document.getElementById('nameInput').value.trim();
                playerName = inputName || "玩家";
                displayName.textContent = playerName;
                
                startModal.style.display = 'none';
                gameActive = true;
                gameStartTime = Date.now();
                
                timerInterval = setInterval(() => {
                    if (gameActive) {
                        elapsedTime = Math.floor((Date.now() - gameStartTime) / 1000);
                        updateTimeDisplay();
                    }
                }, 1000);
            }
            
            function endGame() {
                clearInterval(timerInterval);
                gameActive = false;
                playSound('endhappy');
                playSound('yanhua');
                createConfetti();
                
                finalScoreDisplay.textContent = currentScore;
                finalTimeDisplay.textContent = formatTime(elapsedTime);
                finalNameDisplay.textContent = playerName + " 的成绩单";
                
                errorListDOM.innerHTML = '<strong>错误记录：</strong><br>';
                if (errorRecordsArray.length === 0) {
                    errorListDOM.innerHTML += '<div style="color: #4caf50; margin-top: 10px;">太棒了！无错误记录！</div>';
                } else {
                    errorRecordsArray.forEach(err => {
                        const item = document.createElement('div');
                        item.className = 'error-item';
                        item.textContent = err;
                        errorListDOM.appendChild(item);
                    });
                }
                
                gameOverModal.style.display = 'flex';
            }
            
            function renderValenceButtons() {
                valenceButtonsContainer.innerHTML = '';
                valences.forEach(valence => {
                    const button = document.createElement('button');
                    button.className = 'valence-btn';
                    button.setAttribute('data-valence', valence);
                    button.textContent = valence;
                    button.addEventListener('click', function(e) {
                        if (!gameActive) return;
                        if (e.detail > 1) return;
                        playSound('click');
                        handleValenceClick(this);
                    });
                    valenceButtonsContainer.appendChild(button);
                });
            }
            
            function handleValenceClick(button) {
                valenceButtonsContainer.querySelectorAll('.valence-btn').forEach(btn => btn.classList.remove('selected'));
                button.classList.add('selected');
                selectedValenceVal = button.getAttribute('data-valence');
                
                if (selectedElementBtn) {
                    checkMatch();
                }
            }
            
            function renderElementButtons() {
                elementButtonsContainer.innerHTML = '';
                currentElements.forEach(element => {
                    const button = document.createElement('button');
                    button.className = 'element-btn';
                    button.setAttribute('data-symbol', element.symbol);
                    button.setAttribute('data-valence', element.valence);
                    button.innerHTML = `${element.name}<div class="symbol">${element.displaySymbol}</div>`;
                    button.addEventListener('click', function(e) {
                        if (!gameActive) return;
                        if (e.detail > 1) return;
                        playSound('click');
                        handleElementClick(this);
                    });
                    elementButtonsContainer.appendChild(button);
                });
            }
            
            function handleElementClick(button) {
                if (button.classList.contains('correct')) return;
                
                elementButtonsContainer.querySelectorAll('.element-btn').forEach(btn => {
                    if (!btn.classList.contains('correct')) btn.classList.remove('selected');
                });
                
                button.classList.add('selected');
                selectedElementBtn = button;
                
                if (selectedValenceVal) {
                    checkMatch();
                }
            }
            
            function checkMatch() {
                const correctValence = selectedElementBtn.getAttribute('data-valence');
                const elementName = selectedElementBtn.querySelector('.symbol').previousSibling.textContent.trim();
                const displaySymbol = selectedElementBtn.querySelector('.symbol').textContent;
                
                if (selectedValenceVal === correctValence) {
                    showFeedback(true, `成功消除！${elementName}（${displaySymbol}）的化合价为${correctValence}`);
                    playSound('right');
                    
                    selectedElementBtn.classList.remove('selected');
                    selectedElementBtn.classList.add('correct');
                    
                    const tag = document.createElement('div');
                    tag.className = 'valence-tag';
                    tag.textContent = correctValence;
                    selectedElementBtn.appendChild(tag);
                    
                    currentScore += 5;
                    matchedPairsCount++;
                    updateScoreDisplay();
                    clearSelections();
                    
                    if (matchedPairsCount === currentElements.length) {
                        setTimeout(endGame, 500); 
                    }
                    
                } else {
                    showFeedback(false, `错误匹配！${elementName}（${displaySymbol}）的化合价为${correctValence}`);
                    playSound('error');
                    
                    const errorRecord = `选择了 ${selectedValenceVal} 配对 ${elementName}（${displaySymbol}），正确应为 ${correctValence}`;
                    errorRecordsArray.push(errorRecord);
                    
                    currentScore -= 5;
                    updateScoreDisplay();
                    
                    const errBtn = selectedElementBtn;
                    errBtn.classList.add('shake');
                    setTimeout(() => {
                        errBtn.classList.remove('shake');
                        clearSelections();
                    }, 600);
                }
            }
            
            function clearSelections() {
                selectedElementBtn = null;
                selectedValenceVal = null;
                
                valenceButtonsContainer.querySelectorAll('.valence-btn').forEach(btn => btn.classList.remove('selected'));
                elementButtonsContainer.querySelectorAll('.element-btn').forEach(btn => {
                    if (!btn.classList.contains('correct')) btn.classList.remove('selected');
                });
            }
            
            function showFeedback(isCorrect, message) {
                const feedbackElement = document.createElement('div');
                feedbackElement.className = `feedback ${isCorrect ? 'correct' : 'error'}`;
                feedbackElement.innerHTML = `<div class="feedback-text">${message}</div>`;
                
                feedbackContainer.appendChild(feedbackElement);
                setTimeout(() => { feedbackElement.remove(); }, 1500);
            }
            
            function updateTimeDisplay() {
                timeDisplay.textContent = formatTime(elapsedTime);
            }
            
            function updateScoreDisplay() {
                scoreDisplay.textContent = currentScore;
            }
            
            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            
            function createConfetti() {
                const confettiCount = 100;
                const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722'];
                for (let i = 0; i < confettiCount; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = (Math.random() * 10 + 5) + 'px';
                    confetti.style.opacity = Math.random() * 0.5 + 0.5;
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    confetti.style.animationDelay = (Math.random() * 2) + 's';
                    
                    document.querySelector('.modal-content').appendChild(confetti);
                    setTimeout(() => confetti.remove(), 5000);
                }
            }
            
            startBtn.addEventListener('click', startGame);
            playAgainBtn.addEventListener('click', initGame);
            bgMusicControl.addEventListener('click', toggleBgMusic);
            
            initGame();
        });
    </script>
</body>
</html>
